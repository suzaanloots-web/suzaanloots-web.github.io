<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Page Moved · Kanya Hunt · Couverture Cake Artist</title>
  <meta name="robots" content="noindex"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --linen:#FAF7F2; --parchment:#F4EFE5; --ink:#1E0F06; --mocha:#6B3A1F;
      --caramel:#9B6035; --rose:#B87070; --text-mid:#6B3A1F; --text-light:#9B7A60;
      --border:rgba(139,100,66,0.15); --light-gold:#D4AA60;
      --font-d:'Cormorant Garamond', Georgia, serif; --font-b:'Jost', sans-serif;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--linen); color:var(--ink); font-family:var(--font-b); font-weight:300;
      min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center; padding:2.5rem 1.5rem; line-height:1.7; }
    .brand-name { font-family:var(--font-d); font-size:1.5rem; letter-spacing:0.14em; color:var(--ink); }
    .brand-tagline { font-family:var(--font-d); font-style:italic; font-size:0.95rem; color:var(--caramel); margin-bottom:2.5rem; }
    .eyebrow { font-family:var(--font-b); font-size:0.72rem; letter-spacing:0.28em; text-transform:uppercase; color:var(--caramel); margin-bottom:0.9rem; }
    h1 { font-family:var(--font-d); font-weight:300; font-size:clamp(1.8rem,4vw,2.6rem); color:var(--ink); line-height:1.2; margin-bottom:1rem; }
    h1 em { font-style:italic; color:var(--rose); }
    .divider { width:48px; height:1px; background:var(--light-gold); margin:1.4rem auto; }
    p.lead { font-family:var(--font-d); font-style:italic; font-size:1.1rem; color:var(--text-mid); max-width:440px; margin:0 auto 2rem; }
    .links { display:flex; flex-wrap:wrap; gap:0.8rem; justify-content:center; max-width:560px; }
    .links a { font-family:var(--font-b); font-size:0.75rem; letter-spacing:0.12em; text-transform:uppercase;
      color:var(--mocha); text-decoration:none; border:1px solid var(--border); padding:0.7rem 1.2rem; transition:all 0.2s; }
    .links a:hover { background:var(--mocha); color:var(--linen); border-color:var(--mocha); }
    .home-btn { margin-top:1.8rem; }
    .home-btn a { background:var(--mocha); color:var(--linen); font-family:var(--font-b); font-size:0.78rem;
      letter-spacing:0.14em; text-transform:uppercase; text-decoration:none; padding:0.85rem 2rem; display:inline-block; transition:background 0.25s; }
    .home-btn a:hover { background:var(--ink); }
  </style>
  <script>
    // Smart redirect: send old/broken links to the closest current page.
    (function () {
      var p = (location.pathname + location.search + location.hash).toLowerCase();
      var dest;
      // Mirror the site's nav tabs: My Cakes · Weddings · About Me · Weekend Cakes · FAQ · Contact
      if (/kitchen|weekend|koek/.test(p))                         dest = '/weekend-cakes.html';
      else if (/order|booking|how.?to|tasting|pricing|price|deliver|collection|flavour|flavor|faq|question|ingredient|freshness/.test(p)) dest = '/faq.html';
      else if (/contact|enquir|inquir|quote/.test(p))             dest = '/index.html#contact';
      else if (/gallery|real.?wedding|cake.?cutting|portfolio/.test(p)) dest = '/gallery.html';
      else if (/about|story|kanya/.test(p))                       dest = '/about.html';
      else if (/wedding|cake|chocolate|couverture|white|buttercream|sugar|celebrat|birthday|anniversar|cupcake|mini|petite|croquembouche/.test(p)) dest = '/index.html#offerings';
      else                                                        dest = '/index.html';
      if (dest) {
        // Brief pause so the page reads as intentional, then forward.
        setTimeout(function () { location.replace(dest); }, 1600);
        var note = document.getElementById('redirect-note');
        if (note) note.style.display = 'block';
      }
    })();
  </script>
</head>
<body>
  <div class="brand-name">Kanya Hunt</div>
  <div class="brand-tagline">Couverture Cake Artist &middot; Cape Town &amp; Winelands</div>

  <p class="eyebrow">This page has a new home</p>
  <h1>The website has been <em>refreshed</em></h1>
  <div class="divider"></div>
  <p class="lead">The page you were looking for has moved. <span id="redirect-note" style="display:none;">Taking you to the right place&hellip;</span></p>

  <div class="links">
    <a href="/index.html">Home</a>
    <a href="/index.html#offerings">My Cakes</a>
    <a href="/gallery.html">Weddings</a>
    <a href="/about.html">About Me</a>
    <a href="/weekend-cakes.html">Weekend Cakes</a>
    <a href="/faq.html">FAQ</a>
  </div>

  <div class="home-btn">
    <a href="/index.html#contact">Enquire Now</a>
  </div>
</body>
</html>
